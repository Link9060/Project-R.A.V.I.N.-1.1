services:
  - type: web
    name: ravin
    runtime: docker
    plan: free
    region: ohio
    branch: deployment-prep
    dockerfilePath: ./ravin/Dockerfile
    dockerContext: ./ravin
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: OMNIROUTE_BASE_URL
        value: http://localhost:20128/v1
      - key: FRONTEND_ORIGIN
        value: https://link9060.github.io
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: EMAIL_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT_BASE
        value: https://ravin-hyeq.onrender.com
      - key: FRONTEND_APP_URL
        value: https://link9060.github.io/Project-R.A.V.I.N.-1.1/
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY_SECRET
        generateValue: true
      - key: INITIAL_PASSWORD
        generateValue: true
      - key: OMNIROUTE_WS_BRIDGE_SECRET
        generateValue: true
