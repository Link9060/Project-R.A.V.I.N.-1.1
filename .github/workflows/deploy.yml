name: Validate RAVIN fallback

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate browser JavaScript
        run: |
          for file in ravin/public/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Verify fallback shell contract
        run: |
          grep -q 'data-arrow-os-shell' ravin/public/index.html
          grep -q 'arrow-shell.css' ravin/public/index.html
          grep -q 'arrow-shell.js' ravin/public/index.html
