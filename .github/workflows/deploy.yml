name: Deploy RAVIN to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate browser JavaScript
        run: |
          for file in ravin/public/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Verify ARROW shell mount
        run: |
          grep -q 'data-arrow-os-shell' ravin/public/index.html
          grep -q 'arrow-shell.js' ravin/public/index.html
          grep -q 'app-visible' ravin/public/app.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./ravin/public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4