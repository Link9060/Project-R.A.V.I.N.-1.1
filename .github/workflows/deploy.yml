name: Validate RAVIN fallback

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate browser JavaScript
        run: |
          for file in ravin/public/*.js; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Verify fallback shell contract
        run: |
          grep -q 'data-arrow-os-shell' ravin/public/index.html
          grep -q 'arrow-shell.css' ravin/public/index.html
          grep -q 'arrow-shell.js' ravin/public/index.html

      - name: Check server and ARRAY module syntax
        run: |
          node --check ravin/src/agent/agent.js
          node --check ravin/src/cloudflareClient.js
          node --check ravin/server.js
          node --check ravin/src/array/missionService.js

      - name: Test ARRAY mission service
        run: node --test ravin/tests/array.test.mjs ravin/tests/array-model-routing.test.mjs
