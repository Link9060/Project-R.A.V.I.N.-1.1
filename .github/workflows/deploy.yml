name: Deploy RAVIN to GitHub Pages

on:
  push:
    branches: ["deployment-prep"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ravin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ravin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: npm test

      - name: Verify canonical ARROW shell
        run: |
          grep -q 'data-arrow-os-shell data-module="ravin"' public/ravin-shell.js
          grep -q 'Resonant-Orbit/arrow-shell.css' public/index.html
          grep -q 'Resonant-Orbit/arrow-shell.js' public/index.html
          ! grep -q 'arrow-system.js' public/index.html

  deploy:
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./ravin/public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
