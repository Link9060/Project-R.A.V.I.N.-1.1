name: RAVIN Evolution

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

concurrency:
  group: ravin-evolution
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  evolve:
    # Intentionally OFF unless Levi explicitly enables the repository variable.
    if: ${{ vars.RAVIN_EVOLUTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: Check out evolution lab
        uses: actions/checkout@v4
        with:
          ref: evolution
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ravin/package-lock.json

      - name: Configure evolution commit identity
        run: |
          git config user.name "RAVIN Evolution"
          git config user.email "ravin-evolution@users.noreply.github.com"

      - name: Validate evolution control plane
        run: |
          find .evolution -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node -e "JSON.parse(require('fs').readFileSync('.evolution/state.json','utf8'))"

      - name: Install locked RAVIN dependencies
        working-directory: ravin
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Verify Workers AI credentials are available
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repository Actions secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository Actions secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Run autonomous evolution session
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAVIN_EVOLUTION_MODEL: ${{ vars.RAVIN_EVOLUTION_MODEL }}
          RAVIN_EVOLUTION_EXPLORER_MODEL: ${{ vars.RAVIN_EVOLUTION_EXPLORER_MODEL }}
          RAVIN_EVOLUTION_CRITIC_MODEL: ${{ vars.RAVIN_EVOLUTION_CRITIC_MODEL }}
          EVOLUTION_MAX_ITERATIONS: "8"
          EVOLUTION_MAX_RUN_MINUTES: "50"
          EVOLUTION_MAX_AGENT_STEPS: "18"
          EVOLUTION_AI_TIMEOUT_MS: "45000"
          EVOLUTION_AI_RETRIES: "3"
        run: node .evolution/runner.mjs
