name: RAVIN Evolution

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:

concurrency:
  group: ravin-evolution
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  evolve:
    if: ${{ vars.RAVIN_EVOLUTION_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: Check out evolution lab
        uses: actions/checkout@v4
        with:
          ref: evolution
          fetch-depth: 0
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure evolution commit identity
        run: |
          git config user.name "RAVIN Evolution"
          git config user.email "ravin-evolution@users.noreply.github.com"

      - name: Validate controller
        run: node --check .evolution/runner.mjs

      - name: Verify Workers AI credentials are available
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing repository Actions secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository Actions secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Run autonomous evolution session
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAVIN_EVOLUTION_MODEL: ${{ vars.RAVIN_EVOLUTION_MODEL }}
          EVOLUTION_MAX_ITERATIONS: "8"
          EVOLUTION_MAX_RUN_MINUTES: "52"
          EVOLUTION_MAX_AGENT_STEPS: "16"
        run: node .evolution/runner.mjs
