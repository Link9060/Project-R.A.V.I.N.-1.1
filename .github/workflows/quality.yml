name: RAVIN Quality

on:
  pull_request:
    branches: ["main", "deployment-prep"]
  push:
    branches: ["main", "deployment-prep"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ravin-quality-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ravin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ravin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: npm run check
