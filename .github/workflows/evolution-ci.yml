name: RAVIN Evolution CI

on:
  push:
    branches: ["evolution"]
    paths:
      - ".evolution/**"
      - "ravin/**"
      - ".github/workflows/evolution-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ravin-evolution-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out evolution
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ravin/package-lock.json

      - name: Parse evolution modules
        run: |
          find .evolution -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node -e "JSON.parse(require('fs').readFileSync('.evolution/state.json','utf8'))"

      - name: Install locked RAVIN dependencies
        working-directory: ravin
        run: npm ci --ignore-scripts --no-audit --fund=false

      - name: Run evolution self-tests
        run: node .evolution/selftest.mjs

      - name: Run destructive mutation tests
        run: node .evolution/mutation-test.mjs

      - name: Verify branch and production scheduler safety
        run: |
          test "$(git rev-parse --abbrev-ref HEAD)" = "evolution"
          grep -Fq 'EXPECTED_BRANCH = "evolution"' .evolution/runner.mjs
          git fetch origin main
          git show origin/main:.github/workflows/ravin-evolution.yml > /tmp/ravin-evolution-main.yml
          grep -Fq "vars.RAVIN_EVOLUTION_ENABLED == 'true'" /tmp/ravin-evolution-main.yml
          if grep -Fq "vars.RAVIN_EVOLUTION_ENABLED != 'false'" /tmp/ravin-evolution-main.yml; then
            echo "::error::Production scheduler is fail-open instead of fail-closed."
            exit 1
          fi
