<!doctype html>
<html lang="en" class="ravin-preboot">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0b" />
    <meta name="description" content="RAVIN — Resonant Artificial Virtual Intelligence Network" />
    <title>RAVIN — Resonant Assist</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var theme = localStorage.getItem("ravin_theme") === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#ffffff" : "#0a0a0b");
      })();
    </script>
    <link rel="stylesheet" href="boot.css?v=2" />
    <link rel="stylesheet" href="resonant-shell.css?v=1" />
    <link rel="stylesheet" href="resonant-polish.css?v=1" />
    <link rel="stylesheet" href="ravin-core.css?v=1" />
  </head>
  <body>
    <div class="ravin-boot" id="ravinBoot" aria-label="Start RAVIN">
      <canvas class="ravin-boot-canvas" id="ravinBootCanvas" aria-hidden="true"></canvas>
      <button class="ravin-boot-core" id="ravinBootCore" type="button" aria-label="Initialize RAVIN"></button>
      <div class="ravin-boot-pulse" aria-hidden="true"></div>
    </div>
    <noscript>RAVIN requires JavaScript.</noscript>
    <script src="boot.js?v=2"></script>
    <script src="resonant-shell.js?v=1"></script>
    <script src="resonant-polish.js?v=1"></script>
    <script src="conversation-actions.js?v=1"></script>
    <script src="ravin-core.js?v=1"></script>
  </body>
</html>
